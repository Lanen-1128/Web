<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>聯絡我們</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    div { margin-bottom: 10px; }
    label { display: inline-block; width: 80px; }
  </style>
</head>
<body>

  <h2>聯絡我們</h2>

  <form id="contactForm">
    <div>
      <label>姓名：</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label>電話：</label>
      <input type="tel" id="phone" name="phone" required>
    </div>
    <div>
      <label>EMAIL：</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label>內容：</label><br>
      <textarea id="message" name="message" rows="4" cols="30" required></textarea>
    </div>
    <button type="submit" id="btn">送出資料</button>
  </form>

  <h3 id="msg" style="color: blue;"></h3>

  <script>
    const form = document.getElementById('contactForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    // 你的 Apps Script 網址
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxkXNvcP4UALZ0T-R-EFWbawueVFZibseu0AuFr910T2lu5T1YczkImEH-sF4DE-S6e-w/exec';

    form.addEventListener('submit', function(e) {
      e.preventDefault(); // 阻止頁面跳轉
      
      msg.innerText = "正在寄出信件，請稍候...";
      btn.disabled = true;

      const formData = new FormData(form);

      fetch(scriptURL, {
        method: 'POST',
        body: formData,
        mode: 'no-cors' // 關鍵：避免跨網域被瀏覽器擋下
      })
      .then(() => {
        msg.innerText = "恭喜！表單已送出，請至你的信箱查看收件匣（或垃圾郵件）！";
        msg.style.color = "green";
        form.reset();
      })
      .catch(error => {
        msg.innerText = "發送失敗：" + error;
        msg.style.color = "red";
      })
      .finally(() => {
        btn.disabled = false;
      });
    });
  </script>

</body>
</html>
