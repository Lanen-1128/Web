<script>
  // 將你的 Google Apps Script URL 填入下方：
  const scriptURL = 'https://script.google.com/macros/s/AKfycbxkXNvcP4UALZ0T-R-EFWbawueVFZibseu0AuFr910T2lu5T1YczkImEH-sF4DE-S6e-w/exec';

  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const responseMsg = document.getElementById('responseMsg');
    responseMsg.innerText = "發送中，請稍候...";

    const data = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      message: document.getElementById('message').value
    };

    fetch(scriptURL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(data)
    })
    .then(() => {
      responseMsg.innerText = "表單已成功送出！請至信箱查收。";
      document.getElementById('contactForm').reset();
    })
    .catch(error => {
      console.error('Error!', error.message);
      responseMsg.innerText = "送出失敗，請再試一次。";
    });
  });
</script>
